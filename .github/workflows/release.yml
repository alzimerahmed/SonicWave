name: Release

# Tag-triggered release: `git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z`
# builds an unsigned device archive, packages it as a sideloadable .ipa, and
# publishes a GitHub Release with the artifact attached.
#
# The .ipa is UNSIGNED (CODE_SIGNING_ALLOWED=NO) — this repo has no Apple
# Developer signing assets. It is sideloadable via AltStore/Sideloadly or can
# be re-signed by the maintainer. A signed App Store/TestFlight archive is a
# documented manual step (see docs/ship checklist).

permissions:
  contents: write

on:
  push:
    tags: ["v*"]

env:
  XCODE_PROJECT: SonicWave.xcodeproj
  XCODE_SCHEME: SonicWave
  DERIVED_DATA: DerivedData
  SPM_PACKAGES_DIR: .spm-source-packages

jobs:
  build-release:
    name: Build & publish release
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SPM_PACKAGES_DIR }}
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-xcode-spm-

      - name: Resolve Swift package dependencies
        run: >
          xcodebuild -resolvePackageDependencies
          -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          -clonedSourcePackagesDirPath "$SPM_PACKAGES_DIR"

      # Device archive (iOS + embedded watchOS/widgets targets), unsigned.
      # Release configuration — minify/optimizations are exercised here that
      # Debug CI never sees.
      - name: Archive (unsigned, Release)
        run: >
          xcodebuild archive
          -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath SonicWave.xcarchive
          -derivedDataPath "$DERIVED_DATA"
          -clonedSourcePackagesDirPath "$SPM_PACKAGES_DIR"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          2>&1 | tee xcodebuild-archive.log

      - name: Package unsigned IPA
        run: |
          echo "== archive contents =="
          find SonicWave.xcarchive -maxdepth 4 -name "*.app" -o -name "*.appex" | sort
          APP=$(find SonicWave.xcarchive/Products -maxdepth 3 -name "*.app" -type d | head -1)
          echo "app bundle: $APP"
          test -d "$APP"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p Payload dist
          cp -R "$APP" Payload/
          (cd Payload && zip -qry "../dist/SonicWave-${VERSION}-unsigned.ipa" "$(basename "$APP")")
          # also ship the raw .app for users who prefer direct tools
          (cd "$(dirname "$APP")" && zip -qry "$OLDPWD/dist/SonicWave-${VERSION}-unsigned-app.zip" "$(basename "$APP")")
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SonicWave ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Unsigned build — sideloadable via AltStore/Sideloadly or re-signable.
            See CHANGELOG.md for the full feature list.
          files: dist/*
          fail_on_unmatched_files: true

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-log
          path: xcodebuild-archive.log
          if-no-files-found: ignore
          retention-days: 7
